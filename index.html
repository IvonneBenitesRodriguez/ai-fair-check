<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain Hackers: Fair oder Unfair?</title>
<meta name="description" content="Interaktive Übungen zum Workshop „Brain Hackers: Fair oder Unfair? So denkt KI“ – ReDI School Berlin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&family=Roboto+Flex:wght@400..700&display=swap">
<style>
  :root {
    --hot-pink: #ff347f;
    --pink: #ffe0e0;
    --peach: #ffe8cf;
    --sky: #c7f3ff;
    --mint: #ccffec;
    --lilac: #ffdcf5;
    --blue: #6173f4;
    --plum: #6a425c;
    --brown: #463832;
    --off-white: #fffdfb;
    --green: #1f7a4d;
    --radius: 18px;
    --head: "Google Sans Flex", Arial, sans-serif;
    --body: "Roboto Flex", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--off-white); color: var(--brown); font-family: var(--body); font-size: 1rem; line-height: 1.5; }
  h1, h2, h3 { font-family: var(--head); color: var(--plum); line-height: 1.15; margin: 0 0 .5rem; }
  h1 { font-size: 2.1rem; }
  h2 { font-size: 1.6rem; }
  h3 { font-size: 1.2rem; }
  p { margin: 0 0 1rem; }

  header { background: var(--plum); color: var(--off-white); padding: 2rem 1rem 1.5rem; }
  header .wrap { max-width: 960px; margin: 0 auto; }
  header h1 { color: var(--off-white); }
  header p { color: var(--peach); font-size: 1.05rem; max-width: 40rem; }
  .tag { display: inline-block; background: var(--hot-pink); color: var(--off-white); font-weight: 700; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: .35rem .9rem; margin-bottom: 1rem; }

  nav { position: sticky; top: 0; z-index: 10; background: var(--off-white); border-bottom: 1px solid #efe3da; }
  nav ol { list-style: none; margin: 0 auto; padding: .5rem 1rem; max-width: 960px; display: flex; gap: .5rem; overflow-x: auto; }
  nav a { display: flex; align-items: center; gap: .5rem; min-height: 44px; padding: 0 .9rem; border-radius: 999px; color: var(--plum); text-decoration: none; font-weight: 600; white-space: nowrap; background: var(--peach); }
  nav a span { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--hot-pink); color: var(--off-white); font-size: .85rem; }

  main { max-width: 960px; margin: 0 auto; padding: 0 1rem 3rem; }
  section { padding: 2.5rem 0 1rem; scroll-margin-top: 64px; }
  .step-label { font-weight: 700; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; color: var(--hot-pink); margin-bottom: .25rem; }
  .card { background: #fff; border-radius: var(--radius); padding: 1.25rem; box-shadow: 0 2px 12px rgba(106, 66, 92, .10); margin-bottom: 1rem; }
  .card.peach { background: var(--peach); box-shadow: none; }
  .card.sky { background: var(--sky); box-shadow: none; }
  .card.mint { background: var(--mint); box-shadow: none; }
  .card.lilac { background: var(--lilac); box-shadow: none; }
  .card.pink { background: var(--pink); box-shadow: none; }
  .card.plum { background: var(--plum); color: var(--off-white); box-shadow: none; }
  .card.plum h3, .card.plum .step-label { color: var(--peach); }

  button { font: inherit; cursor: pointer; min-height: 44px; border-radius: 999px; border: 2px solid var(--plum); background: #fff; color: var(--plum); padding: .5rem 1.1rem; font-weight: 600; }
  button:hover { background: var(--lilac); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  button.primary { background: var(--hot-pink); border-color: var(--hot-pink); color: #fff; }
  button.primary:hover { background: #e62a6f; }
  .choices { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0; }
  .question { font-weight: 700; color: var(--plum); }
  .hidden { display: none; }

  /* ---------- Daten-Schalter (Agent-Bias / Agent-Fair) ---------- */
  .data-switch { display: flex; flex-wrap: wrap; gap: .5rem; margin: .25rem 0 1.25rem; }
  .data-switch button.bias[aria-pressed="true"] { background: var(--hot-pink); border-color: var(--hot-pink); color: #fff; }
  .data-switch button.fair[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

  /* ---------- Viele Wege zur 2 ---------- */
  .calc-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .calc-row input { flex: 1 1 10rem; min-height: 52px; font: inherit; font-family: var(--head); font-size: 1.4rem; border: 2px solid var(--plum); border-radius: 12px; padding: .3rem .8rem; background: #fff; color: var(--brown); }
  .calc-row .eq { font-family: var(--head); font-size: 1.6rem; font-weight: 700; color: var(--plum); }
  .ways { list-style: none; padding: 0; margin: 1rem 0 0; display: flex; flex-wrap: wrap; gap: .5rem; }
  .ways li { background: #fff; border-radius: 999px; padding: .35rem .9rem; font-family: var(--head); font-weight: 700; color: var(--plum); }
  .ways li.popular { background: var(--hot-pink); color: #fff; }
  .msg { margin-top: .75rem; font-weight: 600; min-height: 1.5em; }
  .ok { color: var(--green); }
  .bad { color: #b3124f; }

  /* ---------- Team-Maschine ---------- */
  .form-grid { display: grid; gap: .9rem; }
  label { display: block; font-weight: 600; color: var(--plum); margin-bottom: .3rem; }
  .form-grid input, .form-grid select { width: 100%; min-height: 48px; font: inherit; border: 2px solid #e2cfd9; border-radius: 12px; padding: .4rem .8rem; background: #fff; color: var(--brown); }
  .agents { display: grid; gap: 1rem; }
  .agent-title { font-family: var(--head); font-size: 1.2rem; font-weight: 700; color: var(--plum); margin-bottom: .25rem; }
  .agent-rule { font-size: .95rem; margin-bottom: .75rem; }
  .verdict { font-family: var(--head); font-size: 1.7rem; font-weight: 700; color: var(--plum); margin-bottom: .5rem; }
  .neighbors { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; }
  .neighbors li {
